# Comparison data. The format is defined by fpsot-spec-doc (model/jurisdiction.yaml).
topics:
  test-levels: {en: Test levels, fr: Niveaux de test}
  integration-tests: {en: Integration tests, fr: Tests d’intégration}
  bdd: {en: BDD with Gherkin, fr: BDD avec Gherkin}
  domain-experts: {en: Scenarios with domain experts, fr: Scénarios avec les spécialistes du domaine}
  declarative-steps: {en: Declarative steps, fr: Étapes déclaratives}
  feature-languages: {en: Languages of feature files, fr: Langues des fichiers de fonctionnalité}
  consumer-contracts: {en: Consumer-driven contracts, fr: Contrats pilotés par le consommateur}
  conformance-claims: {en: Conformance claims, fr: Déclarations de conformité}
  test-data: {en: Test data, fr: Données de test}
  reserved-values: {en: Reserved values, fr: Valeurs réservées}
  ci-checks: {en: Tests in continuous integration, fr: Tests dans l’intégration continue}
  accessibility-tests: {en: Accessibility tests, fr: Tests d’accessibilité}
rows:
  - id: TST-001
    topic: test-levels
    requirement: {en: "Each test of behavior belongs to one level, and the project marks that level.", fr: "Chaque test du comportement appartient à un niveau, et le projet marque ce niveau."}
    international: {en: "The ISTQB Glossary defines unit testing as a test level for the smallest part of code that can be tested in isolation. It treats end-to-end and functional testing as test types.", fr: "Le glossaire de l’ISTQB définit le test unitaire comme un niveau de test pour la plus petite partie du code qu’on peut tester isolément. Il traite le test de bout en bout et le test fonctionnel comme des types de test."}
    international_source: {title: "ISTQB Glossary, unit testing", version: "4.8.1", url: "https://glossary.istqb.org/en_US/term/unit-testing", archive: "https://web.archive.org/web/20261010095954/https://glossary.istqb.org/en_US/term/unit-testing"}
    fpsot: {en: "Five levels: unit, integration, contract, functional and end-to-end, each with what it may replace with a test double.", fr: "Cinq niveaux : unitaire, intégration, contrat, fonctionnel et bout en bout, chacun avec ce qu’il peut remplacer par une doublure de test."}
  - id: TST-014
    topic: integration-tests
    requirement: {en: "An integration test uses the real product of each dependency it names.", fr: "Un test d’intégration emploie le vrai produit de chaque dépendance qu’il nomme."}
    international: {en: "The ISTQB Glossary defines integration testing as a test level that focuses on the interactions between components or systems. It does not say whether the dependencies are real.", fr: "Le glossaire de l’ISTQB définit le test d’intégration comme un niveau de test centré sur les interactions entre composants ou systèmes. Il ne dit pas si les dépendances sont réelles."}
    international_source: {title: "ISTQB Glossary, integration testing", version: "4.8.1", url: "https://glossary.istqb.org/en_US/term/integration-testing", archive: "https://web.archive.org/web/20260207041832/https://glossary.istqb.org/en_US/term/integration-testing"}
    fpsot: {en: "The real product at its production version, such as in a container. An in-memory stand-in does not count.", fr: "Le vrai produit dans sa version de production, par exemple dans un conteneur. Un produit de remplacement en mémoire ne compte pas."}
  - id: TST-020
    topic: bdd
    requirement: {en: "Each functional test starts from a Gherkin scenario.", fr: "Chaque test fonctionnel part d’un scénario Gherkin."}
    international: {en: "The GovStack architecture describes behavior with Given, When and Then scenarios that tools such as Cucumber run as tests. It strongly recommends this approach, but does not make it mandatory.", fr: "L’architecture de GovStack décrit le comportement par des scénarios Étant donné, Quand et Alors, que des outils comme Cucumber exécutent comme des tests. Elle recommande fortement cette approche, sans la rendre obligatoire."}
    international_source: {title: "GovStack Architecture, 4.2 Functionality Design", version: "source commit e8e7b30", date: "2026-06-08", url: "https://specs.govstack.global/architecture/4-interoperability-architecture/4.2-functionality-design", archive: "https://github.com/GovStackWorkingGroup/cfr-architecture/blob/e8e7b30acd02149b2e178f5a22903a4ba9f7baa2/spec/4-interoperability-architecture/4.2-functionality-design.md"}
    fpsot: {en: "Required for products with business rules or domain behavior, recommended for technical components such as libraries. Existing functional tests may keep their form until they next change.", fr: "Obligatoire pour les produits à règles d’affaires ou à comportement de domaine, recommandé pour les composants techniques comme les bibliothèques. Les tests fonctionnels existants peuvent garder leur forme jusqu’à leur prochain changement."}
  - id: TST-021
    topic: domain-experts
    requirement: {en: "Teams write scenarios with domain experts, before the code.", fr: "Les équipes écrivent les scénarios avec les spécialistes du domaine, avant le code."}
    international: {en: "Cucumber asks at least a product owner, a tester and a developer to discover the examples together. A business representative reviews the Gherkin.", fr: "Cucumber demande qu’au moins une personne responsable du produit, une personne des tests et une personne du développement découvrent les exemples ensemble. Une personne qui représente les affaires revoit le Gherkin."}
    international_source: {title: "Cucumber, Who does what?", date: "2026-11-07", url: "https://cucumber.io/docs/bdd/who-does-what/", archive: "https://web.archive.org/web/20260305073211/https://cucumber.io/docs/bdd/who-does-what/"}
    fpsot: {en: "A domain expert, a developer and a tester should write the scenarios, and a domain expert should review each change.", fr: "Une ou un spécialiste du domaine, une personne du développement et une personne des tests devraient écrire les scénarios, et une ou un spécialiste devrait revoir chaque changement."}
  - id: TST-023
    topic: declarative-steps
    requirement: {en: "Steps state what happens in domain terms, with no detail of the interface or the implementation.", fr: "Les étapes disent ce qui se passe dans les termes du domaine, sans détail de l’interface ni de la mise en œuvre."}
    international: {en: "Cucumber advises steps that describe what, not how, and prefers a declarative style over an imperative one that follows the user interface.", fr: "Cucumber conseille des étapes qui décrivent le quoi et non le comment, et préfère un style déclaratif à un style impératif qui suit l’interface utilisateur."}
    international_source: {title: "Cucumber, Writing better Gherkin", date: "2026-11-07", url: "https://cucumber.io/docs/bdd/better-gherkin/", archive: "https://web.archive.org/web/20260207195808/https://cucumber.io/docs/bdd/better-gherkin/"}
    fpsot: {en: "Required: no page, button, click, HTTP method, table or class name in a step, unless the interface itself is under test.", fr: "Obligatoire : ni page, ni bouton, ni clic, ni méthode HTTP, ni table, ni nom de classe dans une étape, sauf si l’interface elle-même est testée."}
  - id: TST-031
    topic: feature-languages
    requirement: {en: "Each feature file declares its language and uses one fixed keyword per element.", fr: "Chaque fichier de fonctionnalité déclare sa langue et emploie un seul mot clé fixe par élément."}
    international: {en: "Gherkin reads a language header on the first line, defaults to English and offers keywords in more than 70 languages, often several per element.", fr: "Gherkin lit un en-tête de langue sur la première ligne, prend l’anglais par défaut et offre des mots clés dans plus de 70 langues, souvent plusieurs par élément."}
    international_source: {title: "Cucumber, Gherkin Reference", date: "2026-11-07", url: "https://cucumber.io/docs/gherkin/reference/", archive: "https://web.archive.org/web/20261018184653/https://cucumber.io/docs/gherkin/reference/"}
    fpsot: {en: "An English and a French version of each file, with one keyword per element and the same structure and data.", fr: "Une version française et une version anglaise de chaque fichier, avec un mot clé par élément et la même structure et les mêmes données."}
  - id: TST-042
    topic: consumer-contracts
    requirement: {en: "Consumer-driven contracts are allowed, but the published description wins.", fr: "Les contrats pilotés par le consommateur sont permis, mais la description publiée l’emporte."}
    international: {en: "In Pact, the tests of the consumer produce the contract, and the provider verifies it. Only the parts of the provider that consumers use get tested.", fr: "Dans Pact, les tests du consommateur produisent le contrat, et le fournisseur le vérifie. Seules les parties du fournisseur que les consommateurs emploient sont testées."}
    international_source: {title: "Pact Docs, Introduction", date: "2026-08-25", url: "https://docs.pact.io/", archive: "https://web.archive.org/web/20261001124552/https://docs.pact.io/"}
    fpsot: {en: "Allowed in addition to tests against the published OpenAPI description, which stays the contract for all clients.", fr: "Permis en plus des tests sur la description OpenAPI publiée, qui reste le contrat de tous les clients."}
  - id: TST-047
    topic: conformance-claims
    requirement: {en: "Passing a conformance suite is not a certification.", fr: "Réussir une suite de conformité n’est pas une certification."}
    international: {en: "GovStack grades a product by the share of requirements it meets, at two levels, and lists products that reach a level in its catalog.", fr: "GovStack classe un produit selon la part des exigences qu’il respecte, sur deux niveaux, et répertorie dans son catalogue les produits qui atteignent un niveau."}
    international_source: {title: "GovStack, How is compliance measured?", url: "https://govstack.global/software/how-is-compliance-measured/", archive: "https://web.archive.org/web/20260607201230/https://govstack.global/software/how-is-compliance-measured/"}
    fpsot: {en: "No grade, no list. A result names the suite release and the outcome of each requirement.", fr: "Aucun classement, aucune liste. Un résultat nomme la version de la suite et l’issue de chaque exigence."}
  - id: TST-050
    topic: test-data
    requirement: {en: "Tests use synthetic data only, never production personal information.", fr: "Les tests emploient seulement des données synthétiques, jamais des renseignements personnels de production."}
    international: {en: "NIST controls PM-25 and SA-3(2) ask an organization to minimize personal information in testing, and to approve and control live data in preproduction environments.", fr: "Les mesures PM-25 et SA-3(2) du NIST demandent à une organisation de réduire les renseignements personnels dans les tests, et d’approuver et de contrôler les données réelles dans les environnements de préproduction."}
    international_source: {title: "NIST SP 800-53 Rev. 5, Security and Privacy Controls for Information Systems and Organizations", version: "Revision 5, updates as of 2020-12-10", date: "2020-09", url: "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf", archive: "https://web.archive.org/web/20261026212244/https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf"}
    fpsot: {en: "Synthetic data only in repositories, continuous integration and shared test environments. No extract, copy, masked or de-identified version of production personal information. A migration rehearsal in a controlled pre-production environment is outside the specification.", fr: "Seulement des données synthétiques dans les dépôts, l’intégration continue et les environnements de test partagés. Aucun extrait, aucune copie, aucune version masquée ou dépersonnalisée de renseignements personnels de production. La répétition d’une migration dans un environnement de préproduction contrôlé est hors de la spécification."}
  - id: TST-053
    topic: reserved-values
    requirement: {en: "Test data uses values reserved for examples, where they exist.", fr: "Les données de test emploient les valeurs réservées aux exemples, quand il en existe."}
    international: {en: "RFC 2606 reserves the domains example.com, example.net and example.org, and the top-level domains .test, .example, .invalid and .localhost.", fr: "Le RFC 2606 réserve les domaines example.com, example.net et example.org, et les domaines de premier niveau .test, .example, .invalid et .localhost."}
    international_source: {title: "RFC 2606, Reserved Top Level DNS Names", version: "BCP 32", date: "1999-06", url: "https://www.rfc-editor.org/info/rfc2606", archive: "https://web.archive.org/web/20261101081806/https://www.rfc-editor.org/info/rfc2606/"}
    fpsot: {en: "Reserved domains for email and web addresses, and the 555-0100 to 555-0199 line numbers for telephone numbers.", fr: "Des domaines réservés pour les adresses courriel et Web, et les numéros de ligne 555-0100 à 555-0199 pour les numéros de téléphone."}
  - id: TST-060
    topic: ci-checks
    requirement: {en: "Each test level that runs in continuous integration is a required check.", fr: "Chaque niveau de test exécuté dans l’intégration continue est une vérification obligatoire."}
    international: {en: "NIST control SA-11 asks the developer to perform unit, integration, system or regression testing, at a frequency, depth and coverage that the organization sets, with evidence of the results.", fr: "La mesure SA-11 du NIST demande au développeur d’effectuer des tests unitaires, d’intégration, de système ou de régression, selon une fréquence, une profondeur et une couverture que l’organisation fixe, avec des preuves des résultats."}
    international_source: {title: "NIST SP 800-53 Rev. 5, Security and Privacy Controls for Information Systems and Organizations", version: "Revision 5, updates as of 2020-12-10", date: "2020-09", url: "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf", archive: "https://web.archive.org/web/20261026212244/https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf"}
    fpsot: {en: "Unit, integration and contract tests and the Gherkin check on every pull request, as required checks. Flaky tests are quarantined with an issue and a deadline.", fr: "Les tests unitaires, d’intégration et de contrat et la vérification Gherkin à chaque demande de fusion, comme vérifications obligatoires. Les tests instables sont mis en quarantaine avec un billet et une échéance."}
  - id: TST-066
    topic: accessibility-tests
    requirement: {en: "Accessibility tests follow the FPSOT accessibility specification.", fr: "Les tests d’accessibilité suivent la spécification FPSOT sur l’accessibilité."}
    international: {en: "WCAG-EM 2.0 sets five steps to evaluate conformance to WCAG: scope, explore, sample, evaluate and report.", fr: "La WCAG-EM 2.0 fixe cinq étapes pour évaluer la conformité aux WCAG : portée, exploration, échantillon, évaluation et rapport."}
    international_source: {title: "WCAG Evaluation Methodology (WCAG-EM) 2.0", version: "W3C Group Note", date: "2026-07-23", url: "https://www.w3.org/TR/WCAG-EM/", archive: "https://web.archive.org/web/20261024202245/https://www.w3.org/TR/WCAG-EM/"}
    fpsot: {en: "Automated checks in continuous integration on every change, a manual check before each release and a test record, under ACC-040 to ACC-047.", fr: "Des vérifications automatisées dans l’intégration continue à chaque changement, une vérification manuelle avant chaque version et un dossier de test, selon ACC-040 à ACC-047."}
