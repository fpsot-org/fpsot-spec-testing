code: CA-QC
name: {en: Québec, fr: Québec}
rows:
  - id: TST-050
    text: {en: "A CAI guide, without legal force, lists as a practice for public bodies the building of fictitious or anonymous datasets in development environments, such as for unit, functional and integration testing, and in maintenance. The guide dates from 2002, was updated in 2015 and is marked as under revision. FPSOT allows synthetic data only in repositories, continuous integration and shared test environments, and no anonymized production data.", fr: "Un guide de la CAI, sans force de loi, énumère comme pratique pour les organismes publics la construction de jeux de données fictives ou anonymes dans les environnements de développement, comme ceux des essais unitaires, fonctionnels et d’intégration, et d’entretien. Le guide date de 2002, a été mis à jour en 2015 et porte la mention « en cours de révision ». FPSOT permet seulement des données synthétiques dans les dépôts, l’intégration continue et les environnements de test partagés, et aucune donnée de production anonymisée."}
    status: looser
    source: {title: "Commission d’accès à l’information, Guide en matière de protection des renseignements personnels dans le développement des systèmes d’information à l’intention des ministères et organismes publics, item 5.6", version: "Updated 2015-08, under revision", date: "2015-08", url: "https://www.cai.gouv.qc.ca/uploads/pdfs/CAI_GU_RP_Systemes_Information_MO.pdf", archive: "https://web.archive.org/web/20250331195127/http://www.cai.gouv.qc.ca/uploads/pdfs/CAI_GU_RP_Systemes_Information_MO.pdf"}
    last_checked: "2026-11-08"
  - id: TST-066
    text: {en: "The head of each public body must carry out the audits needed to ensure conformity. The Accessibility page of each site must give the name and version of each assistive technology used to verify its conformity. The standard does not require checks in continuous integration.", fr: "La personne à la tête de chaque organisme public doit effectuer les audits nécessaires pour s’assurer de la conformité. La page Accessibilité de chaque site doit donner le nom et la version de chaque technologie d’adaptation informatique employée pour vérifier sa conformité. Le standard n’exige pas de vérifications dans l’intégration continue."}
    status: looser
    source: {title: "Standard sur l’accessibilité des sites Web (SGQRI 008 3.0), ministère de la Cybersécurité et du Numérique", version: "SGQRI 008 3.0, in force 2024-04-29", date: "2026-06-08", url: "https://www.quebec.ca/gouvernement/ministeres-organismes/cybersecurite-numerique/publications/standard-accessibilite-sites-web", archive: "https://web.archive.org/web/20261103004830/https://www.quebec.ca/gouvernement/ministeres-organismes/cybersecurite-numerique/publications/standard-accessibilite-sites-web"}
    last_checked: "2026-11-08"
