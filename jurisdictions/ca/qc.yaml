code: CA-QC
name: {en: Québec, fr: Québec}
rows:
  - id: TST-050
    text: {en: "The guide of the Commission d’accès à l’information tells public bodies to build fictitious or anonymous datasets in development environments, such as for unit, functional and integration testing, and in maintenance. FPSOT allows synthetic data only, and no anonymized production data.", fr: "Le guide de la Commission d’accès à l’information demande aux organismes publics de construire des jeux de données fictives ou anonymes dans les environnements de développement, comme ceux des essais unitaires, fonctionnels et d’intégration, et d’entretien. FPSOT permet seulement des données synthétiques, et aucune donnée de production anonymisée."}
    status: looser
    source: {title: "Commission d’accès à l’information, Guide en matière de protection des renseignements personnels dans le développement des systèmes d’information à l’intention des ministères et organismes publics, item 5.6", version: "Updated 2015-08, under revision", date: "2015-08", url: "https://www.cai.gouv.qc.ca/uploads/pdfs/CAI_GU_RP_Systemes_Information_MO.pdf", archive: "https://web.archive.org/web/20250331195127/http://www.cai.gouv.qc.ca/uploads/pdfs/CAI_GU_RP_Systemes_Information_MO.pdf"}
    last_checked: "2026-11-08"
  - id: TST-066
    text: {en: "Heads of public bodies must carry out the audits needed to ensure conformity, and report the name and version of each assistive technology used to verify it. The standard sets no test method and does not require checks in continuous integration.", fr: "Les personnes à la tête des organismes publics doivent effectuer les audits nécessaires pour s’assurer de la conformité, et déclarer le nom et la version de chaque technologie d’adaptation employée pour la vérifier. Le standard ne fixe aucune méthode de test et n’exige pas de vérifications dans l’intégration continue."}
    status: looser
    source: {title: "Standard sur l’accessibilité des sites Web (SGQRI 008 3.0), ministère de la Cybersécurité et du Numérique", version: "SGQRI 008 3.0, in force 2024-04-29", date: "2026-06-08", url: "https://www.quebec.ca/gouvernement/ministeres-organismes/cybersecurite-numerique/publications/standard-accessibilite-sites-web", archive: "https://web.archive.org/web/20261103004830/https://www.quebec.ca/gouvernement/ministeres-organismes/cybersecurite-numerique/publications/standard-accessibilite-sites-web"}
    last_checked: "2026-11-08"
